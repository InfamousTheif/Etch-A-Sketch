<!DOCTYPE html>
<html>
  <head>
    <link rel="stylesheet" href="sketch.css">
    <meta charset="UTF-8">
    <meta name="description" content="Etch a Sketch">
    <meta name="keywords" content="HTML, CSS, JavaScript,Etch, Sketch">
    <meta name="author" content="Inq">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
  </head>
  <body>
    <header>
      <h1 class="header">Etch a Sketch</h1>
    </header>
    <main>
      <div class="container">
       <div class="slider-container">
          <p id="pixel-counter">50x50 pixels</p>
          <input type="range" min="1" max="100" class="pixel-slider">
       </div>

       <div class="sketch-container">
         <div class="etch-grid" draggable="false"> 
         </div>

         <div class="user-options">
          <button class="clear-button">
            Clear
          </button>

          <button class="erase-button">
            Erase
          </button>

          <input type="color" id="color-picker" value="#000000">
         </div>
       </div>
      </div>
    </main>
    <script src="/sketch.js" defer></script>
  </body>

</html>
